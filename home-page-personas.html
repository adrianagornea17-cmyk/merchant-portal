<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verifone Central — Home Page by Persona</title>
<style>
  :root{--border:#e5e7eb;--bg:#f9fafb;--text:#111827;--muted:#6b7280;--accent:#2563eb;--green:#16a34a;--red:#dc2626;--amber:#d97706}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
  .top{background:#fff;border-bottom:1px solid var(--border);height:56px;display:flex;align-items:center;gap:16px;padding:0 max(24px,calc((100% - 1280px)/2 + 24px))}
  .logo{font-weight:700;font-size:16px;color:var(--accent)}
  .search{flex:1;max-width:420px;border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--muted);background:var(--bg)}
  .sw{border:1px solid var(--border);border-radius:8px;padding:7px 12px;background:#fff;cursor:pointer;font-size:13px}
  .sp{flex:1}
  .bell{position:relative}.bell b{position:absolute;top:-6px;right:-8px;background:var(--red);color:#fff;border-radius:9px;font-size:10px;padding:1px 5px}
  .avatar{width:32px;height:32px;border-radius:50%;background:#0f172a;color:#38bdf8;display:grid;place-items:center;font-weight:600;font-size:12px}
  .persona-bar{background:#0f172a;padding:10px 24px;display:flex;align-items:center;gap:8px}
  .persona-bar span{color:#94a3b8;font-size:12px;margin-right:6px}
  .persona-bar button{background:transparent;border:1px solid #334155;color:#cbd5e1;padding:6px 14px;border-radius:20px;cursor:pointer;font-size:13px}
  .persona-bar button.on{background:#38bdf8;border-color:#38bdf8;color:#0f172a;font-weight:600}
  main{max-width:1280px;margin:0 auto;padding:24px}
  .hello{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px}
  .hello h1{font-size:22px}.hello p{color:var(--muted);margin-top:4px}
  .filters{display:flex;gap:8px;flex-wrap:wrap}
  .chip{border:1px solid var(--border);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px}
  .grid{display:grid;gap:16px;grid-template-columns:repeat(12,1fr);margin-bottom:16px}
  .card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px}
  .s3{grid-column:span 3}.s4{grid-column:span 4}.s6{grid-column:span 6}.s8{grid-column:span 8}.s12{grid-column:span 12}
  @media(max-width:900px){.s3,.s4,.s6,.s8{grid-column:span 12}}
  .card h3{font-size:14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
  .card h3 a{font-size:12px;color:var(--accent);font-weight:500;text-decoration:none}
  .kpi .l{color:var(--muted);font-size:12px}.kpi .v{font-size:24px;font-weight:700;margin:4px 0}
  .d{font-size:12px}.up{color:var(--green)}.down{color:var(--red)}
  .row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--border);font-size:13px;gap:8px}
  .row:first-of-type{border-top:0}
  .row small{color:var(--muted);display:block;margin-top:2px;font-size:12px}
  .pill{border-radius:10px;padding:2px 9px;font-size:11px;font-weight:600;white-space:nowrap}
  .g{background:#f0fdf4;color:#166534}.r{background:#fff1f2;color:#9f1239}.a{background:#fff7ed;color:#c2410c}.b{background:#eff6ff;color:#1d4ed8}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .btn{border:1px solid var(--border);background:#fff;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer}
  .btn.p{background:var(--accent);border-color:var(--accent);color:#fff}
  .bar{height:8px;background:#eef2f7;border-radius:4px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--accent)}
  .steps{display:flex;gap:6px;margin:6px 0}.steps i{flex:1;height:6px;border-radius:3px;background:#e5e7eb}.steps i.f{background:var(--green)}
  svg.chart{width:100%;height:150px}
  .funnel .f{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:13px}
  .funnel .f div{height:26px;background:#bfdbfe;border-radius:4px;color:#1e3a8a;display:flex;align-items:center;padding-left:8px;font-weight:600;font-size:12px}
  .status{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px}
  .dot{width:9px;height:9px;border-radius:50%}
  .note{font-size:12px;color:var(--muted);margin-top:24px;padding-top:12px;border-top:1px dashed var(--border)}
  [hidden]{display:none!important}
</style>
</head>
<body>

<div class="persona-bar">
  <span>Preview home page as:</span>
  <button data-p="smb" class="on">SMB merchant</button>
  <button data-p="ent">Enterprise merchant</button>
  <button data-p="bank">Bank / ISO</button>
  <button data-p="acq">Acquirer</button>
</div>

<div class="top">
  <span class="logo">Verifone Central</span>
  <div class="search">🔍 Search transaction ID, merchant, device…</div>
  <div class="sw" id="switcher">Entity: —  ▾</div>
  <div class="sp"></div>
  <span class="bell">🔔<b>3</b></span>
  <div class="avatar" id="avatar">AG</div>
</div>

<main id="root"></main>

<script>
const spark = (pts,color='#2563eb')=>{
  const max=Math.max(...pts),min=Math.min(...pts);
  const p=pts.map((v,i)=>`${(i/(pts.length-1))*300},${70-((v-min)/(max-min||1))*60}`).join(' ');
  return `<svg class="chart" viewBox="0 0 300 80" preserveAspectRatio="none"><polyline fill="none" stroke="${color}" stroke-width="2" points="${p}"/></svg>`;
};
const kpi=(l,v,d,up=true)=>`<div class="card kpi s3"><div class="l">${l}</div><div class="v">${v}</div><div class="d ${up?'up':'down'}">${up?'▲':'▼'} ${d}</div></div>`;
const rows=a=>a.map(([t,s,p,c])=>`<div class="row"><div>${t}${s?`<small>${s}</small>`:''}</div>${p?`<span class="pill ${c}">${p}</span>`:''}</div>`).join('');
const card=(size,title,body,link='View all')=>`<div class="card ${size}"><h3>${title}${link?`<a href="#">${link}</a>`:''}</h3>${body}</div>`;
const btns=a=>`<div class="actions">${a.map((x,i)=>`<span class="btn ${i==0?'p':''}">${x}</span>`).join('')}</div>`;
const status=a=>a.map(([c,t,n])=>`<div class="status"><span class="dot" style="background:${c}"></span>${t}<b style="margin-left:auto">${n}</b></div>`).join('');
const dates=`<div class="filters"><span class="chip">📅 Last 7 days ▾</span><span class="chip">EUR ▾</span><span class="chip">⚙ Customize</span></div>`;
const G='#16a34a',R='#dc2626',A='#d97706';

const P={

</div>

${card('s4','Quick actions',btns(['View transactions','Issue a refund','Download report','Order supplies','Take a payment']),'')}

${card('s6','Finish setting up (3 of 5)',`<div class="steps"><i class="f"></i><i class="f"></i><i class="f"></i><i></i><i></i></div>`+rows([['Verify business details','','Done','g'],['Add a bank account','','Done','g'],['Activate 2nd location (Harbour St.)','Documents needed','Continue','b'],['Order a countertop terminal','','Start','b']]),'')}
${card('s6','Help & orders',rows([['Order #VF-20931 — 2× P400 Plus','Shipped · arrives Thu','Track','b'],['Support ticket #48211','Waiting for your reply','Open','a'],['Guide: How to handle a chargeback','','Read','b']]),'Help centre')}

<div class="hello"><div><h1>Operations center — EMEA Acquiring</h1><p>Live view · refreshed 10 sec ago</p></div>

const root=document.getElementById('root');
function show(k){
  document.querySelectorAll('.persona-bar button').forEach(b=>b.classList.toggle('on',b.dataset.p===k));
  document.getElementById('switcher').textContent='Entity: '+P[k].entity;
  document.getElementById('avatar').textContent=P[k].avatar;
  root.innerHTML=P[k].html()+`<div class="note">Mockup — sample data. Shared on every home page: greeting, entity/location switcher, date-range & currency, alerts, global search, customizable widgets.</div>`;
}
document.querySelectorAll('.persona-bar button').forEach(b=>b.onclick=()=>show(b.dataset.p));
show('smb');
</script>
</body>
</html>
